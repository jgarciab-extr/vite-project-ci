name: CI React Check

on:

  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    steps:

    - name: 1. Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4

      	with:
        	node-version: 18
        	cache: 'npm'

    - name: 3. Instalar dependencias del proyecto
      run: npm install

    - name: 4. Comprobar que el proyecto compila correctamente
      run: npm run build
